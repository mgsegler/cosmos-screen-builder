<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSMOS Screen Builder</title>
<style>
:root{
  --bg:#0e1116;--panel:#151a21;--panel2:#1b212a;--line:#262e39;--text:#d6dde6;--muted:#8792a2;--faint:#5d6878;
  --accent:#4da3ff;--accent-weak:rgba(77,163,255,.14);--danger:#ff6b6b;--warn:#f5c451;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* Approximations of the COSMOS data-visualization palette, for preview only */
  --color-data-visualization-1:#5fa8f0;--color-data-visualization-2:#a77be6;--color-data-visualization-3:#e9a23b;
  --color-data-visualization-4:#4fc08d;--color-data-visualization-5:#ec6a77;--color-data-visualization-6:#3cc3c8;
  --color-data-visualization-7:#d5b23a;--color-data-visualization-8:#97a2b6;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-rows:46px minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:14px;font-weight:600;margin:0 10px 0 2px;white-space:nowrap}
header .sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#3a4554;background:#222935}
.btn.primary{background:#1f5fa8;border-color:#2a72c4;color:#fff}
.btn.primary:hover:not(:disabled){background:#2a6fbf}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:2px 7px;font-size:12px}
.btn.danger{color:var(--danger)}
.tog{display:flex;align-items:center;gap:5px;color:var(--muted);white-space:nowrap;cursor:pointer}
main{display:grid;grid-template-columns:220px minmax(0,1fr) 330px;min-height:0}

/* left: palette + outline */
#left{background:var(--panel);border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto minmax(0,1.2fr) auto minmax(0,1fr);min-height:0}
.ptitle{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 10px 5px;font-weight:600}
.ptitle.bt{border-top:1px solid var(--line)}
#search{margin:0 10px 6px;padding:5px 8px;background:var(--bg);border:1px solid var(--line);border-radius:5px;width:calc(100% - 20px)}
#palette,#outline{overflow:auto;padding:0 6px 10px}
.pcat{font-size:11px;color:var(--faint);margin:10px 4px 3px;text-transform:uppercase;letter-spacing:.05em}
.pi{padding:3px 8px;border-radius:4px;cursor:grab;font-family:var(--mono);font-size:12px;color:#c4ccd7;user-select:none}
.pi:hover{background:var(--accent-weak);color:#fff}
.orow{font-family:var(--mono);font-size:11.5px;padding:2px 6px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#b9c2ce}
.orow:hover{background:#1f2630}
.orow.sel{background:var(--accent-weak);color:#fff}
.orow .s{color:var(--faint);margin-left:6px}
.orow.raw{color:#6f7d70;font-style:italic}
.orow.unk .t{color:var(--warn)}

/* center: stage + code */
#center{display:grid;grid-template-rows:minmax(0,1fr) auto auto;min-height:0;min-width:0}
#stagewrap{overflow:auto;padding:28px;background-color:#0b0e12;background-image:radial-gradient(#1c232d 1px,transparent 1px);background-size:16px 16px}
#grip{height:6px;cursor:ns-resize;background:var(--panel);border-top:1px solid var(--line)}
#grip:hover{background:#1f2834}
#codepanel{background:var(--panel);display:flex;flex-direction:column;height:240px;min-height:60px}
.codebar{display:flex;align-items:center;gap:6px;padding:4px 10px 6px}
.codebar .ptitle{padding:0;margin-right:6px}
#codestatus{color:var(--muted);font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#codestatus.dirty{color:var(--warn)}
#codestatus.err{color:var(--danger)}
#code{flex:1;resize:none;margin:0 10px 10px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font:12.5px/1.5 var(--mono);color:#cfe3c9;tab-size:2;white-space:pre;outline:none}
#code:focus{border-color:#35506f}

/* right: inspector */
#right{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-height:0}
#insp{padding:12px 14px 30px}
.itype{font-family:var(--mono);font-size:16px;font-weight:600;color:#fff}
.icat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.idesc{color:#aab3bf;margin:6px 0 0}
.sec{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.sech{display:flex;align-items:center;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:6px}
.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:12px;color:#aab3bf;margin-bottom:2px}
.fld>span b{color:var(--danger);font-weight:400}
.fld input,.fld select,.fld textarea,.srow input,.srow select,.sech select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 7px;outline:none}
.fld textarea{font-family:var(--mono);font-size:12px;resize:vertical;min-height:54px}
.fld input:focus,.fld select:focus,.fld textarea:focus,.srow input:focus{border-color:#3d6ea3}
.fld input.bad{border-color:#7a3a3a}
.fld .hint{font-size:11px;color:var(--faint);margin-top:2px}
.srow{display:grid;grid-template-columns:104px 1fr 24px;gap:4px;margin:4px 0}
.srow input{font-family:var(--mono);font-size:12px}
.srow button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;padding:0}
.srow button:hover{color:var(--danger)}
.sech select{width:auto;max-width:170px;text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;padding:2px 4px}
.acts{display:flex;flex-wrap:wrap;gap:5px}
.note{background:#1b2230;border:1px solid #29344a;border-radius:6px;padding:8px 10px;color:#aeb8c6;font-size:12px;margin-top:10px}
.note.warn{border-color:#5a4a20;background:#231f12;color:#e3cf8f}
.tips{color:#9aa4b1;font-size:12px;padding-left:16px;margin:6px 0}
.tips li{margin:4px 0}
kbd{font-family:var(--mono);font-size:11px;background:#232a34;border:1px solid #333d4a;border-radius:3px;padding:0 4px}

#dropline{position:fixed;display:none;background:var(--accent);border-radius:2px;pointer-events:none;z-index:1000;box-shadow:0 0 6px var(--accent)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#243246;border:1px solid #35506f;color:#fff;padding:7px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:1001}
#toast.on{opacity:1}

/* ---------- COSMOS-like preview ---------- */
.screen{display:inline-block;min-width:220px;background:#1b2330;color:#e8eef5;border:1px solid #2e3a4b;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.45);font:14px/1.3 Roboto,"Helvetica Neue",Arial,sans-serif;vertical-align:top}
.screen-title{background:#243042;padding:6px 10px;font-size:13px;font-weight:600;letter-spacing:.02em;display:flex;justify-content:space-between;gap:20px;color:#dfe7f1;border-radius:4px 4px 0 0}
.screen-title span{color:#7f8da1;font-weight:400}
.screen-body{padding:8px;overflow:auto}
.kids{display:flex;gap:4px;min-height:18px}
.kids.o-v{flex-direction:column}
.kids.o-h{flex-direction:row;align-items:flex-start}
.kids.o-g{display:grid;align-items:center;column-gap:8px}
.kids.drop-target{background:rgba(77,163,255,.07);border-radius:3px}
.w{position:relative;border:1px dashed transparent;border-radius:2px}
.w.leaf{display:flex;align-items:center;gap:6px;padding:1px 2px;min-height:22px}
.w.leaf.j-split{justify-content:space-between}
.w.leaf.j-center{justify-content:center}
.w.leaf.j-right{justify-content:flex-end}
.w.cont{padding:3px}
.guides .w.cont{border-color:rgba(110,150,210,.35);padding-top:13px}
.guides .w.cont.framed{padding-top:3px}
.w .ctag{display:none;position:absolute;top:0;left:0;font:9px/12px var(--mono);padding:0 4px;color:#8fb8ea;background:rgba(77,163,255,.14);border-radius:0 0 3px 0;pointer-events:none;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.guides .w.cont:not(.framed)>.ctag{display:block}
.w:hover:not(:has(.w:hover)){border-color:rgba(77,163,255,.6)}
.w.sel{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.w.framed{border:1px solid #3a4658;border-radius:4px;padding:3px 6px 6px}
.w.framed>.boxtitle{font-size:13px;font-weight:600;color:#c9d6e6;padding:3px 2px 5px}
.empty{color:#6b7a90;font-size:11px;border:1px dashed #3a4a60;padding:8px 10px;text-align:center;border-radius:3px;min-width:110px;font-family:system-ui,sans-serif}
.lbl{white-space:pre}
.vb{display:inline-block;border:1px solid #3d4b60;border-radius:3px;padding:1px 6px;background:#111925;font:13px/18px "Roboto Mono",Menlo,monospace;white-space:pre;overflow:hidden;text-align:left}
.ttl{font-size:20px;font-weight:500;text-align:center;padding:4px 8px;width:100%}
.shdr{width:100%;border-bottom:1px solid #8a97a8;font-weight:600;padding:2px 0}
.hr{width:100%;height:0;border-top:1px solid #56647a;margin:4px 0}
.leaf.c-horizontalline,.leaf.c-title,.leaf.c-sectionheader{flex:1 1 auto;align-self:stretch}
.spacer{display:inline-block}
.guides .spacer{background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(120,150,190,.15) 4px 8px)}
.lbar{position:relative;display:inline-block;border:1px solid #4a5568;background:linear-gradient(to right,#ff3838 0 10%,#fce83a 10% 20%,#56f000 20% 80%,#fce83a 80% 90%,#ff3838 90%)}
.lbar.vert{background:linear-gradient(to top,#ff3838 0 10%,#fce83a 10% 20%,#56f000 20% 80%,#fce83a 80% 90%,#ff3838 90%)}
.lbar .m{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;box-shadow:0 0 0 1px #000;transform:translateX(-1px)}
.lbar.vert .m{top:auto;left:-2px;right:-2px;width:auto;height:3px;bottom:50%}
.rbar{position:relative;display:inline-block;border:1px solid #4a5568;background:#2a3646}
.rbar .m{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff}
.pbar{display:inline-block;height:16px;border:1px solid #4a5568;background:#16202c;border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:#2d8cf0}
.led{display:inline-block;border-radius:50%;border:1px solid rgba(0,0,0,.5)}
.btnp{display:inline-block;background:#2a5d9a;color:#fff;border-radius:4px;padding:4px 12px;font-size:13px;font-weight:500;text-transform:none;white-space:pre}
.tf{display:inline-block;border-bottom:1px solid #8090a5;padding:2px 4px;min-height:22px;background:#152030;color:#c7d2df;white-space:pre}
.chk{display:inline-block;width:14px;height:14px;border:2px solid #8fa0b6;border-radius:2px}
.chk.on{background:#4da3ff;border-color:#4da3ff}
.radio{display:inline-block;width:14px;height:14px;border:2px solid #8fa0b6;border-radius:50%}
.panelbox{display:inline-flex;flex-direction:column;border:1px solid #3d4b60;background:#111925;font:12px/1.4 "Roboto Mono",Menlo,monospace;color:#c7d2df;overflow:hidden;padding:4px 6px;white-space:pre}
.graph{display:inline-block;border:1px solid #3d4b60;background:#111925;position:relative}
.graph .gl{position:absolute;top:3px;left:6px;font-size:11px;color:#9fb0c5}
.ph{display:inline-flex;align-items:center;justify-content:center;border:1px dashed #556377;color:#8796aa;font-size:12px;text-align:center;padding:4px;background:#141c27;overflow:hidden}
.gen{font-family:var(--mono);font-size:12px;color:var(--warn);border:1px dashed #6b5a2a;padding:2px 6px;border-radius:3px}
.tabhdrs{display:flex;gap:2px;border-bottom:1px solid #3a4658;min-height:28px;align-items:flex-end}
.tabh{padding:5px 14px;color:#9fb0c5;cursor:pointer;border-bottom:2px solid transparent;font-size:13px;text-transform:uppercase;letter-spacing:.04em;border-radius:0}
.tabh.act{color:#fff;border-bottom-color:#4da3ff}
.tabh.sel{outline:2px solid var(--accent)}
.tabpane{padding-top:4px}
svg.cv{display:block;overflow:visible}
svg.cv [data-id]{cursor:move}
svg.cv .hit{stroke:transparent}
svg.cv .selbox{fill:none;stroke:#4da3ff;stroke-width:1.5;stroke-dasharray:4 3;pointer-events:none}
.guides svg.cv{outline:1px dashed rgba(110,150,210,.35)}
</style>
</head>
<body>
<header>
  <h1>COSMOS Screen Builder</h1>
  <button class="btn" id="bNew" title="Start a blank screen">New</button>
  <button class="btn" id="bExample" title="Load the example screen">Example</button>
  <button class="btn" id="bOpen" title="Open a COSMOS screen .txt file">Open…</button>
  <input type="file" id="file" accept=".txt,text/plain" hidden>
  <button class="btn" id="bUndo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
  <button class="btn" id="bRedo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
  <label class="tog"><input type="checkbox" id="guides" checked> Layout guides</label>
  <span class="sp"></span>
  <button class="btn" id="bDownload">Download .txt</button>
  <button class="btn primary" id="bCopy">Copy screen text</button>
</header>
<main>
  <aside id="left">
    <div class="ptitle">Widgets</div>
    <input id="search" placeholder="Filter widgets…" autocomplete="off">
    <div id="palette"></div>
    <div class="ptitle bt">Outline</div>
    <div id="outline"></div>
  </aside>
  <section id="center">
    <div id="stagewrap"><div id="stage"></div></div>
    <div id="grip" title="Drag to resize"></div>
    <div id="codepanel">
      <div class="codebar">
        <span class="ptitle">Screen definition</span>
        <span id="codestatus"></span>
        <button class="btn sm" id="bApply" disabled>Apply text → designer</button>
        <button class="btn sm" id="bRevert" disabled>Revert</button>
      </div>
      <textarea id="code" spellcheck="false"></textarea>
    </div>
  </section>
  <aside id="right"><div id="insp"></div></aside>
</main>
<div id="dropline"></div>
<div id="toast"></div>
<datalist id="dl-tgt"></datalist><datalist id="dl-pkt"></datalist><datalist id="dl-item"></datalist><datalist id="dl-color"></datalist>

<script>
'use strict';

/* =====================================================================
   Widget catalog
   Param spec: n=name, k=kind (str|num|choice|tgt|pkt|item|code|list|color),
   opt=optional, fill=value emitted when blank but a later param is set,
   init=value for a freshly created widget, opts=choices
   ===================================================================== */
const VT = ['RAW','CONVERTED','FORMATTED','WITH_UNITS'];
const JUST = ['SPLIT','CENTER','LEFT','RIGHT'];
const TLM = [{n:'Target',k:'tgt',init:'INST'},{n:'Packet',k:'pkt',init:'HEALTH_STATUS'},{n:'Item',k:'item',init:'TEMP1'}];
const vt = fill => ({n:'Value type',k:'choice',opts:VT,opt:true,fill});
const o = (n,fill,k='num',x={}) => ({n,k,opt:true,fill,...x});
const r = (n,init='',k='str',x={}) => ({n,k,init,...x});
const CH = (fill='12') => o('Characters',fill);
const COMMON_SETTINGS = ['WIDTH 100','HEIGHT 50','PADDING 5','MARGIN 5','BACKCOLOR var(--color-data-visualization-1)','TEXTCOLOR white','BORDERCOLOR grey','TEXTALIGN CENTER','RAW font-weight bold'];

const DEFS = {
  // ---- Layout
  VERTICAL:{cat:'Layout',grp:'lay',box:'v',desc:'Stacks widgets top-to-bottom. Invisible on the real screen.',params:[o('Margin','0')]},
  HORIZONTAL:{cat:'Layout',grp:'lay',box:'h',desc:'Places widgets left-to-right. Invisible on the real screen.',params:[o('Margin','0')]},
  VERTICALBOX:{cat:'Layout',grp:'lay',box:'v',framed:true,desc:'Bordered box with optional title; stacks widgets top-to-bottom.',params:[o('Title','','str',{init:'Group'}),o('Margin','0')]},
  HORIZONTALBOX:{cat:'Layout',grp:'lay',box:'h',framed:true,desc:'Bordered box with optional title; places widgets left-to-right.',params:[o('Title','','str',{init:'Group'}),o('Margin','0')]},
  MATRIXBYCOLUMNS:{cat:'Layout',grp:'lay',box:'g',desc:'Grid filled row by row with N columns.',params:[r('Columns','2','num'),o('Margin','0')]},
  SCROLLWINDOW:{cat:'Layout',grp:'lay',box:'v',scroll:true,desc:'Scrollable area of fixed height.',params:[o('Height','200','num',{init:'200'}),o('Margin','0')]},
  TABBOOK:{cat:'Layout',box:'tabs',desc:'Tabbed container. Holds TABITEMs. Click a tab header to switch tabs.',params:[],kids:()=>[mk('TABITEM',['Tab 1']),mk('TABITEM',['Tab 2'])]},
  TABITEM:{cat:'Layout',box:'v',desc:'One tab page. Only goes inside a TABBOOK.',params:[r('Tab text','Tab')]},

  // ---- Decoration
  TITLE:{cat:'Decoration',grp:'txt',desc:'Large centered title text.',params:[r('Text','Title')]},
  LABEL:{cat:'Decoration',grp:'txt',desc:'Static text. Font params are optional (use nil to skip).',params:[r('Text','Label'),o('Font','nil','str'),o('Size','nil'),o('Weight','nil','choice',{opts:['NORMAL','BOLD']}),o('Italic','nil','choice',{opts:['true','false']})]},
  SECTIONHEADER:{cat:'Decoration',grp:'txt',desc:'Text with an underline.',params:[r('Text','Section')]},
  HORIZONTALLINE:{cat:'Decoration',desc:'Horizontal divider line.',params:[]},
  SPACER:{cat:'Decoration',desc:'Empty space of a fixed size.',params:[r('Width','20','num'),r('Height','20','num')]},

  // ---- Telemetry
  VALUE:{cat:'Telemetry',grp:'tlm',desc:'Telemetry value in a box.',params:[...TLM,vt('WITH_UNITS'),CH()]},
  LABELVALUE:{cat:'Telemetry',grp:'tlm',desc:'Item name and its value.',params:[...TLM,vt('WITH_UNITS'),CH(),o('Justification','SPLIT','choice',{opts:JUST})]},
  LABELVALUEDESC:{cat:'Telemetry',grp:'tlm',desc:'Description (or item name) and value.',params:[...TLM,o('Description','','str'),vt('WITH_UNITS'),CH()]},
  FORMATVALUE:{cat:'Telemetry',grp:'tlm',desc:'Value formatted with a printf-style string.',params:[...TLM,r('Format','%.2f'),vt('CONVERTED'),CH()]},
  LABELVALUELIMITSBAR:{cat:'Telemetry',grp:'tlm',desc:'Label, value, and limits bar. Subwidgets: 0 label, 1 value, 2 bar.',params:[...TLM,vt('CONVERTED'),CH()]},
  LABELVALUELIMITSCOLUMN:{cat:'Telemetry',grp:'tlm',desc:'Label, value, and vertical limits column.',params:[...TLM,vt('CONVERTED'),CH()]},
  VALUELIMITSBAR:{cat:'Telemetry',grp:'tlm',desc:'Value and limits bar. Subwidgets: 0 value, 1 bar.',params:[...TLM,vt('CONVERTED'),CH()]},
  VALUELIMITSCOLUMN:{cat:'Telemetry',grp:'tlm',desc:'Value and vertical limits column.',params:[...TLM,vt('CONVERTED'),CH()]},
  LIMITSBAR:{cat:'Telemetry',grp:'tlm',desc:'Horizontal limits bar.',params:[...TLM,vt('CONVERTED'),o('Width','160'),o('Height','25')]},
  LIMITSCOLUMN:{cat:'Telemetry',grp:'tlm',desc:'Vertical limits column.',params:[...TLM,vt('CONVERTED'),o('Width','30'),o('Height','100')]},
  LIMITSCOLOR:{cat:'Telemetry',grp:'tlm',desc:'Colored dot showing limits state.',params:[...TLM,vt('CONVERTED'),o('Radius','10'),o('Full name','FALSE','choice',{opts:['TRUE','FALSE','NIL']})],xs:['ASTRO TRUE']},
  RANGEBAR:{cat:'Telemetry',grp:'tlm',desc:'Bar showing value between low and high.',params:[...TLM,r('Low','0','num'),r('High','100','num'),vt('CONVERTED'),o('Width','160'),o('Height','25')]},
  VALUERANGEBAR:{cat:'Telemetry',grp:'tlm',desc:'Value and range bar.',params:[...TLM,r('Low','0','num'),r('High','100','num'),vt('CONVERTED'),CH(),o('Width','160'),o('Height','25')]},
  LABELVALUERANGEBAR:{cat:'Telemetry',grp:'tlm',desc:'Label, value and range bar.',params:[...TLM,r('Low','0','num'),r('High','100','num'),vt('CONVERTED'),CH(),o('Width','160'),o('Height','25')]},
  PROGRESSBAR:{cat:'Telemetry',grp:'tlm',desc:'Progress bar (value × scale, 0-100).',params:[...TLM,o('Scale','1.0'),o('Width','80'),vt('CONVERTED')]},
  LABELPROGRESSBAR:{cat:'Telemetry',grp:'tlm',desc:'Label and progress bar.',params:[...TLM,o('Scale','1.0'),o('Width','80'),vt('CONVERTED')]},
  LED:{cat:'Telemetry',grp:'tlm',desc:'Colored LED. Map values to colors with SETTING LED_COLOR <value> <color>.',params:[...TLM,vt('CONVERTED'),o('Width','15'),o('Height','15')],settings:[['SETTING','LED_COLOR','GOOD','GREEN'],['SETTING','LED_COLOR','BAD','RED']],xs:['LED_COLOR GOOD GREEN','LED_COLOR BAD RED','LED_COLOR ANY ORANGE']},
  LABELLED:{cat:'Telemetry',grp:'tlm',desc:'Label and LED. Map values with SETTING LED_COLOR.',params:[...TLM,vt('CONVERTED'),o('Width','15'),o('Height','15'),o('Justification','SPLIT','choice',{opts:JUST})],settings:[['SETTING','LED_COLOR','GOOD','GREEN'],['SETTING','LED_COLOR','BAD','RED']],xs:['LED_COLOR GOOD GREEN','LED_COLOR BAD RED','LED_COLOR ANY ORANGE']},
  TEXTBOX:{cat:'Telemetry',grp:'tlm',desc:'Multi-line text box for long string values.',params:[...TLM,o('Width','200'),o('Height','200')]},
  ARRAY:{cat:'Telemetry',grp:'tlm',desc:'Array values in a grid.',params:[...TLM,o('Width','200'),o('Height','100'),o('Format','nil','str'),o('Items per row','4'),vt('WITH_UNITS')],init:{2:'ARY'}},

function tokenize(line, comments = true) {

    const hasList = d.params.some(p => p.k === 'list');

    }

  } else {

  }
  ps.append(h('label', {class: 'fld'}, h('span', null, 'Widget name (NAMED_WIDGET, optional)'),

    h('div', {class: 'hint'}, 'Lets BUTTON code read it via screen.getNamedWidget(\'NAME\').')));
  box.append(ps, settingsSection(n, d), actions(f));
}

function actions(f) {

}

/* =====================================================================
   Operations
   ===================================================================== */
function convert(n, type) {
  const od = DEFS[n.type], nd = DEFS[type], by = {};
  od.params.forEach((p, i) => { if (n.params[i] !== undefined) by[p.n] = n.params[i]; });
  n.params = nd.params.map(p => by[p.n] ?? (p.opt ? '' : p.init ?? ''));
  n.type = type;
  if (nd.settings && !n.settings.length) n.settings = nd.settings.map(s => ({kw: s[0], args: s.slice(1)}));
}
function insertAt(parent, idx, node) { parent.children.splice(idx, 0, node); }
function placeNode(node) {
  const t = node.type, s = state.sel && find(state.sel);
  if (s) {
    if (s.node.children && accepts(s.node.type, t)) { insertAt(s.node, s.node.children.length, node); return true; }
    // Walk up: insert after the selected node (or its ancestor) in the first parent that accepts it
    let child = s.node;
    for (let i = s.path.length - 1; i >= 0; i--) {
      const p = s.path[i];
      if (accepts(p.type, t)) { insertAt(p, p.children.indexOf(child) + 1, node); return true; }
      child = p;
    }
  }
  if (accepts('ROOT', t)) { insertAt(scr.root, scr.root.children.length, node); return true; }
  let host = null; walk(scr.root, x => { if (!host && x.children && x.id !== 'root' && accepts(x.type, t)) host = x; });
  if (host) { insertAt(host, host.children.length, node); return true; }
  const hostType = DEFS[t]?.cv ? 'CANVAS' : t === 'TABITEM' ? 'TABBOOK' : t === 'RADIOBUTTON' ? 'RADIOGROUP' : null;
  if (hostType) { const hn = mk(hostType); hn.children = [node]; insertAt(scr.root, scr.root.children.length, hn); return true; }
  return false;
}
function addWidget(type) {
  snapshot();
  const node = mk(type);
  if (placeNode(node)) { select(node.id); renderCode(); save(); }
}
function moveBy(dir) {
  const f = state.sel && find(state.sel); if (!f) return;
  const j = f.index + dir; if (j < 0 || j >= f.parent.children.length) return;
  snapshot();
  f.parent.children.splice(f.index, 1); f.parent.children.splice(j, 0, f.node);
  renderAll();
}
function duplicate() {
  const f = state.sel && find(state.sel); if (!f) return;
  snapshot();
  const c = cloneNode(f.node);
  nudgeCanvas(c, 10, 10);
  insertAt(f.parent, f.index + 1, c); select(c.id); renderCode(); save();
}
function del() {
  const f = state.sel && find(state.sel); if (!f) return;
  snapshot();
  f.parent.children.splice(f.index, 1);
  const next = f.parent.children[f.index] || f.parent.children[f.index - 1];
  state.sel = next ? next.id : (f.parent.id === 'root' ? null : f.parent.id);
  renderAll();
}
function wrap(type) {
  const f = state.sel && find(state.sel); if (!f) return;
  if (!accepts(f.parent.type, type)) return toast(`${type} can't go inside ${f.parent.type}`);
  snapshot();
  const w = mk(type); w.children = [f.node];
  f.parent.children.splice(f.index, 1, w);
  select(w.id); renderCode(); save();
}
function unwrap() {
  const f = state.sel && find(state.sel); if (!f || !f.node.children) return;
  if (!f.node.children.every(c => accepts(f.parent.type, c.type))) return toast('The parent can\'t hold these children');
  snapshot();
  f.parent.children.splice(f.index, 1, ...f.node.children);
  state.sel = f.node.children[0]?.id || null; renderAll();
}
function nudgeCanvas(n, dx, dy) {
  const d = DEFS[n.type]; if (!d || !d.pos) return;
  for (const [xi, yi] of d.pos) { n.params[xi] = String(Math.round(num(n.params[xi], 0) + dx)); n.params[yi] = String(Math.round(num(n.params[yi], 0) + dy)); }
}
function setCanvasPos(n, x, y) {
  const d = DEFS[n.type]; if (!d || !d.pos) return;
  const [xi, yi] = d.pos[0];
  nudgeCanvas(n, x - num(n.params[xi], 0), y - num(n.params[yi], 0));
}
function copySel() { const f = state.sel && find(state.sel); if (f) { state.clip = JSON.stringify(f.node); toast('Widget copied'); } }
function pasteClip() {
  if (!state.clip) return;
  snapshot();
  const node = reid(JSON.parse(state.clip));
  nudgeCanvas(node, 10, 10);
  if (placeNode(node)) { select(node.id); renderCode(); save(); }
}

/* =====================================================================
   Selection, rendering, persistence
   ===================================================================== */
function select(id) {
  state.sel = id;
  if (id) {
    const f = find(id);
    if (f) { // make sure enclosing tabs are visible
      const chain = [...f.path, f.node];
      for (let i = 1; i < chain.length; i++) if (chain[i].type === 'TABITEM' && chain[i - 1].type === 'TABBOOK') state.activeTab[chain[i - 1].id] = chain[i].id;
    }
  }
  renderStage(); renderOutline(); renderInspector();
}
function renderCode() {
  if (state.codeDirty) return;
  $('#code').value = generate();
  setStatus('', '');
}
function setStatus(msg, cls) {
  const s = $('#codestatus'); s.textContent = msg; s.className = cls || '';
  $('#bApply').disabled = $('#bRevert').disabled = !state.codeDirty;
}
function renderAll() { renderStage(); renderOutline(); renderInspector(); renderCode(); updateUndo(); save(); }
const KEY = 'cosmos-screen-builder-v1';
function save() { try { localStorage.setItem(KEY, JSON.stringify({scr, guides: state.guides})); } catch (e) { /* storage unavailable */ } }
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

/* =====================================================================
   Palette
   ===================================================================== */
function renderPalette() {
  const f = $('#search').value.trim().toUpperCase();
  const box = $('#palette'); box.innerHTML = '';
  for (const cat of CATS) {
    const items = Object.keys(DEFS).filter(k => DEFS[k].cat === cat && (!f || k.includes(f) || DEFS[k].desc.toUpperCase().includes(f)));
    if (!items.length) continue;
    box.append(h('div', {class: 'pcat'}, cat));
    for (const k of items) box.append(h('div', {class: 'pi', draggable: 'true', 'data-type': k, title: DEFS[k].desc + '\n\nDrag onto the screen, or click to add.'}, k));
  }
}
$('#search').addEventListener('input', renderPalette);
$('#palette').addEventListener('click', e => { const p = e.target.closest('.pi'); if (p) addWidget(p.dataset.type); });
$('#palette').addEventListener('dragstart', e => {
  const p = e.target.closest('.pi'); if (!p) return;
  drag = {kind: 'new', type: p.dataset.type};
  e.dataTransfer.effectAllowed = 'copy'; e.dataTransfer.setData('text/plain', p.dataset.type);
});
$('#outline').addEventListener('click', e => { const r = e.target.closest('.orow'); if (r && r.dataset.id) select(r.dataset.id); });
$('#outline').addEventListener('dragstart', e => {
  const r = e.target.closest('.orow'); if (!r || !r.dataset.id) return;
  drag = {kind: 'move', id: r.dataset.id}; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', r.dataset.id);
});

/* =====================================================================
   Drag & drop on the stage
   ===================================================================== */
let drag = null, cvDrag = null;
const dropline = $('#dropline');
stage.addEventListener('dragstart', e => {
  if (cvDrag) { e.preventDefault(); return; }
  const el = e.target.closest && e.target.closest('[data-id]');
  if (!el) return;
  drag = {kind: 'move', id: el.dataset.id};
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', el.dataset.id);
  e.stopPropagation();
});
function dragType() { return drag.kind === 'new' ? drag.type : find(drag.id)?.node.type; }
function resolveKids(el) {
  if (!el) return null;
  if (el.dataset.tabbook) return el.querySelector(':scope > .tabhdrs');
  return el;
}
function findDropTarget(e) {
  const type = dragType(); if (!type) return null;
  let k = resolveKids(e.target.closest ? e.target.closest('.kids, [data-tabbook]') : null);
  while (k) {
    const cid = k.dataset.cid, cn = nodeById(cid);
    const ok = cn && accepts(cn.type, type) && !(drag.kind === 'move' && isInside(drag.id, cid));
    if (ok) break;
    k = resolveKids(k.parentElement && k.parentElement.closest('.kids, [data-tabbook]'));
  }
  if (!k && accepts('ROOT', type)) k = stage.querySelector('.kids[data-cid="root"]');
  if (!k) return null;
  const o = k.dataset.orient;
  if (o === 'c') {
    const r = k.querySelector('svg').getBoundingClientRect();
    return {k, cid: k.dataset.cid, index: nodeById(k.dataset.cid).children.length, x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top), items: []};
  }
  const items = [...k.children].filter(c => c.dataset && c.dataset.id);
  let i = 0;
  for (; i < items.length; i++) {
    const r = items[i].getBoundingClientRect();
    if (o === 'v') { if (e.clientY < r.top + r.height / 2) break; }
    else if (o === 'h') { if (e.clientX < r.left + r.width / 2) break; }
    else { if (e.clientY < r.top) break; if (e.clientY <= r.bottom && e.clientX < r.left + r.width / 2) break; }
  }
  // map DOM index -> model index (RAWLINEs are invisible but live in the model)
  const parent = nodeById(k.dataset.cid);
  const index = i < items.length ? parent.children.findIndex(c => c.id === items[i].dataset.id) : parent.children.length;
  return {k, cid: k.dataset.cid, index, domIndex: i, items};
}
function clearDrop() { dropline.style.display = 'none'; document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target')); }
function showDrop(t) {
  clearDrop();
  t.k.classList.add('drop-target');
  const o = t.k.dataset.orient;
  if (o === 'c') return;
  let x, y, w, hh;
  const items = t.items;
  if (!items.length) { const r = t.k.getBoundingClientRect(); x = r.left + 4; y = r.top + r.height / 2 - 1; w = Math.max(20, r.width - 8); hh = 3; }
  else {
    const last = t.domIndex >= items.length, r = items[last ? items.length - 1 : t.domIndex].getBoundingClientRect();
    if (o === 'v') { x = r.left; w = r.width; hh = 3; y = last ? r.bottom + 1 : r.top - 3; }
    else { y = r.top; hh = r.height; w = 3; x = last ? r.right + 1 : r.left - 3; }
  }
  Object.assign(dropline.style, {display: 'block', left: x + 'px', top: y + 'px', width: w + 'px', height: hh + 'px'});
}
stage.addEventListener('dragover', e => {
  if (!drag) return;
  const t = findDropTarget(e);
  if (!t) { clearDrop(); return; }
  e.preventDefault(); e.dataTransfer.dropEffect = drag.kind === 'new' ? 'copy' : 'move';
  showDrop(t);
});
$('#stagewrap').addEventListener('dragover', e => { if (drag && !stage.contains(e.target)) { const t = findDropTarget(e); if (t) { e.preventDefault(); showDrop(t); } } });
$('#stagewrap').addEventListener('drop', e => {
  e.preventDefault();
  if (!drag) return;
  const t = findDropTarget(e); clearDrop();
  if (t) doDrop(t);
  drag = null;
});
document.addEventListener('dragend', () => { drag = null; clearDrop(); });
function doDrop(t) {
  const target = nodeById(t.cid);
  if (drag.kind === 'new') {
    snapshot();
    const node = mk(drag.type);
    if (t.k.dataset.orient === 'c') setCanvasPos(node, t.x, t.y);
    insertAt(target, t.index, node);
    select(node.id); renderCode(); save();
  } else {
    const f = find(drag.id); if (!f) return;
    let idx = t.index;
    if (f.parent === target && f.index < idx) idx--;
    if (f.parent === target && idx === f.index && t.k.dataset.orient !== 'c') return;
    snapshot();
    f.parent.children.splice(f.index, 1);
    if (t.k.dataset.orient === 'c') setCanvasPos(f.node, t.x, t.y);
    insertAt(target, idx, f.node);
    select(f.node.id); renderCode(); save();
  }
}

/* click selection */
stage.addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (!el) { if (state.sel) select(null); return; }
  if (el.dataset.tab) state.activeTab[el.dataset.tab] = el.dataset.id;
  select(el.dataset.id);
});
$('#stagewrap').addEventListener('click', e => { if (e.target === e.currentTarget && state.sel) select(null); });

/* canvas item dragging */
stage.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('svg.cv [data-id]');
  if (!g || e.button !== 0) return;
  e.preventDefault();
  const n = find(g.dataset.id).node;
  cvDrag = {id: n.id, sx: e.clientX, sy: e.clientY, orig: n.params.slice(), moved: false, snap: JSON.stringify(scr)};
  if (state.sel !== n.id) select(n.id);
});
window.addEventListener('pointermove', e => {
  if (!cvDrag) return;
  let dx = e.clientX - cvDrag.sx, dy = e.clientY - cvDrag.sy;
  if (!cvDrag.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
  if (!cvDrag.moved) { hist.push(cvDrag.snap); fut = []; cvDrag.moved = true; updateUndo(); }
  const n = find(cvDrag.id)?.node; if (!n) return;
  const d = DEFS[n.type];
  n.params = cvDrag.orig.slice();
  const [xi, yi] = d.pos[0], x0 = num(n.params[xi], 0), y0 = num(n.params[yi], 0);
  if (e.shiftKey) { dx = Math.round((x0 + dx) / 10) * 10 - x0; dy = Math.round((y0 + dy) / 10) * 10 - y0; }
  nudgeCanvas(n, dx, dy);
  renderStage();
});
window.addEventListener('pointerup', () => {
  if (!cvDrag) return;
  const moved = cvDrag.moved; cvDrag = null;
  if (moved) { renderOutline(); renderInspector(); renderCode(); save(); }
});

/* =====================================================================
   Keyboard
   ===================================================================== */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  const mod = e.metaKey || e.ctrlKey, k = e.key;
  if (mod && k.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
  if (typing) return;
  if (mod && k.toLowerCase() === 'd') { e.preventDefault(); duplicate(); return; }
  if (mod && k.toLowerCase() === 'c') { if (state.sel && !getSelection().toString()) { e.preventDefault(); copySel(); } return; }
  if (mod && k.toLowerCase() === 'v') { if (state.clip) { e.preventDefault(); pasteClip(); } return; }
  if (k === 'Escape') { select(null); return; }
  if ((k === 'Delete' || k === 'Backspace') && state.sel) { e.preventDefault(); del(); return; }
  if (k.startsWith('Arrow') && state.sel) {
    const n = find(state.sel)?.node; if (!n) return;
    if (DEFS[n.type]?.cv) {
      e.preventDefault(); snapshot();
      const s = e.shiftKey ? 10 : 1;
      nudgeCanvas(n, k === 'ArrowLeft' ? -s : k === 'ArrowRight' ? s : 0, k === 'ArrowUp' ? -s : k === 'ArrowDown' ? s : 0);
      renderStage(); renderInspector(); renderCode(); save();
    } else if (e.altKey && (k === 'ArrowUp' || k === 'ArrowDown')) { e.preventDefault(); moveBy(k === 'ArrowUp' ? -1 : 1); }
  }
});

/* =====================================================================
   Header buttons, code panel, file IO
   ===================================================================== */
function loadText(text, label) {
  const {screen, warn} = parse(text);
  snapshot();
  scr = screen; state.sel = null; state.activeTab = {}; state.codeDirty = false;
  renderAll();
  if (warn.length) setStatus('Loaded with notes: ' + warn.join(' · '), 'err');
  else if (label) toast(label);
}
$('#bNew').onclick = () => { snapshot(); const t = scr.target; scr = newScreen(); scr.target = t; state.sel = null; state.codeDirty = false; renderAll(); };
$('#bExample').onclick = () => loadText(EXAMPLE, 'Example loaded');
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bOpen').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  scr.name = f.name.replace(/\.txt$/i, '');
  loadText(await f.text(), 'Opened ' + f.name); e.target.value = '';
};
$('#guides').onchange = e => { state.guides = e.target.checked; renderStage(); save(); };
$('#bCopy').onclick = async () => {
  const text = state.codeDirty ? $('#code').value : generate();
  try { await navigator.clipboard.writeText(text); }
  catch (err) { const t = $('#code'); t.focus(); t.select(); document.execCommand('copy'); }
  toast('Screen text copied — paste it into COSMOS');
};
$('#bDownload').onclick = () => {
  const text = state.codeDirty ? $('#code').value : generate();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'}));
  a.download = (scr.name || 'screen').toLowerCase().replace(/[^a-z0-9_-]+/g, '_') + '.txt';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#code').addEventListener('input', () => { state.codeDirty = true; setStatus('Text edited — Apply to update the designer, or Revert', 'dirty'); });
$('#bApply').onclick = () => { state.codeDirty = false; loadText($('#code').value, 'Applied'); };
$('#bRevert').onclick = () => { state.codeDirty = false; renderCode(); };

/* resizable code panel */
$('#grip').addEventListener('pointerdown', e => {
  const startY = e.clientY, startH = $('#codepanel').offsetHeight;
  const mv = ev => { $('#codepanel').style.height = Math.max(60, Math.min(window.innerHeight - 160, startH - (ev.clientY - startY))) + 'px'; };
  const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
});

const EXAMPLE = `SCREEN AUTO AUTO 1.0

VERTICAL
  TITLE "INST Health and Status"
  HORIZONTAL
    VERTICALBOX "Temperatures"
      LABELVALUELIMITSBAR INST HEALTH_STATUS TEMP1
      LABELVALUELIMITSBAR INST HEALTH_STATUS TEMP2
      LABELVALUELIMITSBAR INST HEALTH_STATUS TEMP3
      LABELVALUELIMITSBAR INST HEALTH_STATUS TEMP4
    END
    VERTICALBOX "Collects"
      LABELVALUE INST HEALTH_STATUS COLLECTS
      LABELVALUE INST HEALTH_STATUS COLLECT_TYPE
      LABELLED INST HEALTH_STATUS GROUND1STATUS
        SETTING LED_COLOR CONNECTED GREEN
        SETTING LED_COLOR UNAVAILABLE RED
      HORIZONTAL
        BUTTON 'Start Collect' "api.cmd('INST COLLECT with TYPE NORMAL, DURATION 5')"
        BUTTON 'Abort' "api.cmd('INST ABORT')"
      END
    END
  END
  LABELSPARKLINE INST HEALTH_STATUS TEMP1
END
`;

/* =====================================================================
   Boot
   ===================================================================== */
(function boot() {
  renderPalette();
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.scr && saved.scr.root) { scr = saved.scr; state.guides = saved.guides !== false; }
  else scr = parse(EXAMPLE).screen;
  $('#guides').checked = state.guides;
  renderAll();
})();
</script>
</body>
